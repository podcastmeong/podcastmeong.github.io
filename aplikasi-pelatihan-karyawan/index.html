    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.5rem; }
      * { box-sizing: border-box; }
      :root {
        --bg: #eef7f0;
        --bg-soft: #e3f2e7;
        --card: #ffffff;
        --ink: #132419;
        --muted: #57705f;
        --green: #16a34a;
        --green-d: #15803d;
        --green-deep: #14532d;
        --green-soft: #dcf5e3;
        --green-line: #bfe6cc;
        --line: #d8ecdd;
        --danger: #dc2626;
        --danger-soft: #fdecec;
        --slate-soft: #eef2f0;
        --shadow: 0 6px 24px rgba(20, 83, 45, .08), 0 1px 3px rgba(20, 83, 45, .06);
        --shadow-lg: 0 18px 48px rgba(20, 83, 45, .18);
        --radius: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1610;
          --bg-soft: #0f2016;
          --card: #12241a;
          --ink: #e7f5ec;
          --muted: #9db8a6;
          --green: #22c55e;
          --green-d: #4ade80;
          --green-deep: #bbf7d0;
          --green-soft: #173d27;
          --green-line: #1f5136;
          --line: #1e3a29;
          --danger: #f87171;
          --danger-soft: #3d1d1d;
          --slate-soft: #1a2b21;
          --shadow: 0 6px 24px rgba(0,0,0,.35);
          --shadow-lg: 0 18px 48px rgba(0,0,0,.5);
        }
      }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; }

      /* ===== Header ===== */
      header.hero {
        background: var(--green-deep);
        color: #f0fdf4;
        padding: 28px 0 64px;
        margin-bottom: -44px;
      }
      @media (prefers-color-scheme: dark) {
        header.hero { background: #0f2c1c; color: #e7f5ec; }
      }
      .hero-inner { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
      .hero .company {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
        background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
        padding: 5px 12px; border-radius: 999px;
      }
      .hero h1 { margin: 14px 0 6px; font-size: clamp(1.6rem, 4.5vw, 2.3rem); font-weight: 800; line-height: 1.2; }
      .hero p { margin: 0; opacity: .88; max-width: 620px; font-size: .98rem; }

      /* ===== Tab nav ===== */
      nav.tabs {
        display: flex; flex-wrap: wrap; gap: 8px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 10px; position: relative; z-index: 2;
      }
      nav.tabs button {
        flex: 1 1 auto;
        border: 1px solid transparent; background: transparent; color: var(--muted);
        font: inherit; font-weight: 600; font-size: .92rem;
        padding: 9px 14px; border-radius: 11px; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        transition: background .15s, color .15s;
      }
      nav.tabs button svg { width: 17px; height: 17px; flex: none; }
      nav.tabs button:hover { background: var(--green-soft); color: var(--green-d); }
      nav.tabs button.active { background: var(--green); color: #fff; }
      @media (prefers-color-scheme: dark) {
        nav.tabs button.active { color: #08130c; }
      }

      main { margin-top: 22px; }
      section.tabpage { display: none; }
      section.tabpage.active { display: block; }

      .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
      .page-head h2 { margin: 0; font-size: 1.3rem; font-weight: 800; }
      .page-head .sub { color: var(--muted); font-size: .9rem; width: 100%; margin-top: -6px; }
      .spacer { flex: 1; }

      /* ===== Buttons ===== */
      .btn {
        font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
        border-radius: 11px; padding: 9px 16px; border: 1px solid var(--green);
        background: var(--green); color: #fff;
        display: inline-flex; align-items: center; gap: 7px; justify-content: center;
        transition: background .15s, transform .1s;
      }
      .btn:hover { background: var(--green-d); border-color: var(--green-d); }
      .btn:active { transform: scale(.98); }
      .btn.ghost { background: var(--card); color: var(--green-d); border-color: var(--green-line); }
      .btn.ghost:hover { background: var(--green-soft); }
      .btn.small { padding: 6px 12px; font-size: .83rem; min-height: 2.25rem; border-radius: 9px; }
      .btn.danger { background: var(--card); color: var(--danger); border-color: #f3c2c2; }
      .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
      @media (prefers-color-scheme: dark) { .btn.danger { border-color: #5b2b2b; } }
      .btn svg { width: 16px; height: 16px; }

      /* ===== Cards & grids ===== */
      .grid { display: grid; gap: 14px; }
      .grid.trainings { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
      }
      .tcard { cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; flex-direction: column; gap: 10px; }
      .tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
      .tcard h3 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
      .tcard .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: .87rem; color: var(--muted); }
      .tcard .meta b { color: var(--ink); font-weight: 600; }
      .tcard .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--line); }
      .tcard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .cat { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--green-d); }

      .badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      }
      .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .badge.green { background: var(--green-soft); color: var(--green-d); }
      .badge.solid { background: var(--green); color: #fff; }
      .badge.solid::before { background: #fff; }
      .badge.gray { background: var(--slate-soft); color: var(--muted); }
      .badge.red { background: var(--danger-soft); color: var(--danger); }
      .badge.outline { background: transparent; border: 1px solid var(--green-line); color: var(--green-d); }

      /* ===== Lists / rows ===== */
      .rowlist { display: flex; flex-direction: column; gap: 10px; }
      .row {
        background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 14px 16px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      }
      .row .main { flex: 1 1 220px; min-width: 0; }
      .row .main .t { font-weight: 700; font-size: .98rem; }
      .row .main .s { color: var(--muted); font-size: .85rem; }
      .row select.status-sel { width: auto; min-width: 132px; }
      .row input.nilai-inp { width: 84px; }

      /* ===== Forms ===== */
      label.f { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 12px; }
      label.f span { display: block; margin-bottom: 5px; color: var(--muted); font-weight: 600; }
      input, select, textarea {
        font: inherit; font-size: .95rem; color: var(--ink);
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 9px 12px; width: 100%;
      }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
      @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
      .toolbar label.f { margin-bottom: 0; flex: 1 1 260px; }
      .toolbar label.f span { margin-bottom: 5px; }

      /* ===== Modal ===== */
      .overlay {
        position: fixed; inset: 0; background: rgba(10, 30, 18, .55);
        display: none; align-items: flex-start; justify-content: center;
        padding: 22px 14px; overflow-y: auto; z-index: 50;
      }
      .overlay.open { display: flex; }
      .modal {
        background: var(--card); color: var(--ink); border-radius: 18px; box-shadow: var(--shadow-lg);
        width: 100%; max-width: 560px; padding: 22px; margin: auto 0;
      }
      .modal.wide { max-width: 640px; }
      .modal h3 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 800; }
      .modal .msub { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
      .modal .mfoot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
      .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 12px 0; }
      .detail-grid div span { display: block; font-size: .76rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
      .detail-grid div b { font-weight: 600; }
      .mini-list { margin: 8px 0 0; padding: 0; list-style: none; }
      .mini-list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
      .mini-list li:last-child { border-bottom: none; }
      .modal h4 { margin: 16px 0 4px; font-size: .95rem; font-weight: 700; color: var(--green-d); }

      /* ===== Jadwal ===== */
      .sched-date {
        flex: none; width: 62px; text-align: center;
        background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 12px; padding: 8px 4px;
      }
      .sched-date .d { font-size: 1.25rem; font-weight: 800; color: var(--green-d); line-height: 1.1; }
      .sched-date .m { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--green-d); }
      .row.past { opacity: .62; }

      /* ===== Laporan ===== */
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
      .stat { text-align: left; }
      .stat .num { font-size: 1.9rem; font-weight: 800; color: var(--green-d); line-height: 1.15; }
      .stat .lbl { color: var(--muted); font-size: .86rem; font-weight: 600; }
      table.rtable { width: 100%; border-collapse: collapse; font-size: .92rem; }
      table.rtable th, table.rtable td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
      table.rtable th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      table.rtable td.num, table.rtable th.num { text-align: right; }
      table.rtable tr:last-child td { border-bottom: none; font-weight: 700; }
      @media (max-width: 620px) {
        table.rtable thead { display: none; }
        table.rtable, table.rtable tbody, table.rtable tr, table.rtable td { display: block; width: 100%; }
        table.rtable tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
        table.rtable td { border-bottom: none; padding: 4px 12px; display: flex; justify-content: space-between; gap: 12px; }
        table.rtable td::before { content: attr(data-l); font-weight: 700; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
        table.rtable td.num { text-align: left; }
      }

      /* ===== Panduan ===== */
      .guide h3 { margin: 22px 0 8px; font-size: 1.05rem; font-weight: 800; color: var(--green-d); }
      .guide h3:first-child { margin-top: 0; }
      .guide p, .guide li { font-size: .93rem; }
      .guide ul { margin: 6px 0 0; padding-left: 20px; }
      .guide li { margin-bottom: 4px; }
      .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 10px; }
      .price-card { border: 1px solid var(--green-line); border-radius: var(--radius); padding: 16px; background: var(--bg-soft); }
      .price-card h4 { margin: 0 0 8px; font-size: .95rem; font-weight: 800; }
      .price-card table { width: 100%; border-collapse: collapse; font-size: .9rem; }
      .price-card td { padding: 5px 0; border-bottom: 1px dashed var(--line); }
      .price-card td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
      .price-card tr:last-child td { border-bottom: none; }
      .wa-btn { background: #16a34a; border-color: #16a34a; color: #fff; text-decoration: none; }
      .wa-btn:hover { background: #15803d; border-color: #15803d; }

      .empty {
        text-align: center; color: var(--muted); padding: 34px 18px;
        background: var(--card); border: 1px dashed var(--green-line); border-radius: var(--radius); font-size: .93rem;
      }
      footer.note {
        margin-top: 28px; text-align: center; color: var(--muted); font-size: .85rem;
        background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 14px 18px; box-shadow: var(--shadow);
      }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--green-deep); color: #f0fdf4; padding: 11px 20px; border-radius: 999px;
        font-size: .9rem; font-weight: 600; box-shadow: var(--shadow-lg);
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 90;
        max-width: calc(100vw - 32px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      a.filelink { color: var(--green-d); font-weight: 600; font-size: .87rem; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
      a.filelink:hover { text-decoration: underline; }
      a.filelink svg { width: 14px; height: 14px; }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        html { scroll-behavior: auto; }
      }
    </style>
  </head>

        ],

      /* ================= HELPER ================= */
      var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      var BULAN_S = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function parseISO(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
      function fmtDate(iso) { if (!iso) return "—"; var d = parseISO(iso); return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); }
      function todayISO() { var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
      function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); function p(x) { return (x < 10 ? "0" : "") + x; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
      function endDate(t) { return addDays(t.tanggal, Math.max(1, t.durasi) - 1); }
      function dateRange(t) { var e = endDate(t); return t.durasi > 1 ? fmtDate(t.tanggal) + " – " + fmtDate(e) : fmtDate(t.tanggal); }
      function getTraining(id) { for (var i = 0; i < state.trainings.length; i++) if (state.trainings[i].id === id) return state.trainings[i]; return null; }
      function partsOf(tid) { return state.participants.filter(function (p) { return p.tid === tid; }); }
      function matsOf(tid) { return state.materials.filter(function (m) { return m.tid === tid; }); }
      function statusBadge(st) {
        if (st === "Selesai" || st === "Lulus") return '<span class="badge solid">' + st + "</span>";
        if (st === "Berjalan" || st === "Hadir") return '<span class="badge green">' + st + "</span>";
        if (st === "Tidak Lulus") return '<span class="badge red">' + st + "</span>";
        return '<span class="badge gray">' + st + "</span>";
      }
      function toast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg; el.classList.add("show");
        clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove("show"); }, 2600);
      }

      /* ================= IKON SVG ================= */
      var IC = {
        pelatihan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.5"/></svg>',
        peserta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        jadwal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
        materi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
        sertifikat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13l1.5 8-5-3-5 3 1.5-8"/></svg>',
        laporan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
        panduan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        unduh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',
        berkas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
      };

      var TABS = [
        { id: "pelatihan", label: "Pelatihan", icon: "pelatihan" },
        { id: "peserta", label: "Peserta", icon: "peserta" },
        { id: "jadwal", label: "Jadwal", icon: "jadwal" },
        { id: "materi", label: "Materi", icon: "materi" },
        { id: "sertifikat", label: "Sertifikat", icon: "sertifikat" },
        { id: "laporan", label: "Laporan", icon: "laporan" },
        { id: "panduan", label: "Panduan", icon: "panduan" }
      ];
    </script>
    <script>
      "use strict";
      /* ================= NAV & HALAMAN ================= */
      var pagesEl = document.getElementById("pages");
      var navEl = document.getElementById("tabNav");

      function buildNav() {
        navEl.innerHTML = TABS.map(function (t) {
          return '<button type="button" data-tab="' + t.id + '"' + (state.activeTab === t.id ? ' class="active"' : "") + ">" + IC[t.icon] + esc(t.label) + "</button>";
        }).join("");
        var btns = navEl.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function () { switchTab(this.getAttribute("data-tab")); });
        }
      }
      function switchTab(id) {
        state.activeTab = id;
        buildNav(); render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function render() {
        var html = "";
        if (state.activeTab === "pelatihan") html = pagePelatihan();
        else if (state.activeTab === "peserta") html = pagePeserta();
        else if (state.activeTab === "jadwal") html = pageJadwal();
        else if (state.activeTab === "materi") html = pageMateri();
        else if (state.activeTab === "sertifikat") html = pageSertifikat();
        else if (state.activeTab === "laporan") html = pageLaporan();
        else html = pagePanduan();
        pagesEl.innerHTML = '<section class="tabpage active">' + html + "</section>";
        bindPage();
      }

      /* ================= TAB 1: PELATIHAN ================= */
      function pagePelatihan() {
        var cards = state.trainings.map(function (t) {
          var jml = partsOf(t.id).length;
          return '<article class="card tcard" data-detail="' + t.id + '" tabindex="0" role="button" aria-label="Lihat detail ' + esc(t.nama) + '">' +
            '<div class="top"><span class="cat">' + esc(t.kategori) + "</span>" + statusBadge(t.status) + "</div>" +
            "<h3>" + esc(t.nama) + "</h3>" +
            '<div class="meta">' +
            "<span>Pelatih<br><b>" + esc(t.pelatih) + "</b></span>" +
            "<span>Durasi<br><b>" + t.durasi + " hari</b></span>" +
            "<span>Peserta<br><b>" + jml + " orang</b></span>" +
            "<span>Tanggal<br><b>" + dateRange(t) + "</b></span>" +
            "</div>" +
            '<div class="actions">' +
            '<button type="button" class="btn ghost small" data-edit-t="' + t.id + '">Ubah</button>' +
            '<button type="button" class="btn danger small" data-del-t="' + t.id + '">Hapus</button>' +
            '<span class="spacer"></span><span style="font-size:.83rem;color:var(--green-d);font-weight:700;align-self:center">Lihat Detail ›</span>' +
            "</div></article>";
        }).join("");
        return '<div class="page-head"><h2>Daftar Pelatihan</h2><span class="spacer"></span>' +
          '<button type="button" class="btn" id="btnAddTraining">' + IC.plus + "Tambah Pelatihan</button>" +
          '<p class="sub">' + state.trainings.length + " pelatihan terdaftar di PT Maju Bersama. Klik kartu untuk melihat detail lengkap.</p></div>" +
          (state.trainings.length ? '<div class="grid trainings">' + cards + "</div>" : '<div class="empty">Belum ada pelatihan. Klik “Tambah Pelatihan” untuk membuat yang pertama.</div>');
      }

      function trainingFormHTML(t) {
        t = t || { nama: "", kategori: "Teknis", pelatih: "", durasi: 1, status: "Direncanakan", tanggal: todayISO(), jam: "08.00–16.00", tempat: "" };
        function opts(list, val) { return list.map(function (o) { return '<option value="' + esc(o) + '"' + (o === val ? " selected" : "") + ">" + esc(o) + "</option>"; }).join(""); }
        return '<div class="form-grid">' +
          '<label class="f" style="grid-column:1/-1"><span>Nama Pelatihan</span><input id="fNama" type="text" value="' + esc(t.nama) + '" placeholder="cth. Pelatihan Kepemimpinan" required></label>' +
          '<label class="f"><span>Kategori</span><select id="fKategori">' + opts(KATEGORI, t.kategori) + "</select></label>" +
          '<label class="f"><span>Status</span><select id="fStatus">' + opts(["Direncanakan", "Berjalan", "Selesai"], t.status) + "</select></label>" +
          '<label class="f"><span>Pelatih</span><input id="fPelatih" type="text" value="' + esc(t.pelatih) + '" placeholder="Nama pelatih" required></label>' +
          '<label class="f"><span>Durasi (hari)</span><input id="fDurasi" type="number" min="1" max="30" value="' + t.durasi + '"></label>' +
          '<label class="f"><span>Tanggal Mulai</span><input id="fTanggal" type="date" value="' + t.tanggal + '"></label>' +
          '<label class="f"><span>Jam</span><input id="fJam" type="text" value="' + esc(t.jam) + '" placeholder="08.00–16.00"></label>' +
          '<label class="f" style="grid-column:1/-1"><span>Tempat / Ruang</span><input id="fTempat" type="text" value="' + esc(t.tempat) + '" placeholder="cth. Ruang Melati"></label>' +
          "</div>";
      }
      function openTrainingForm(id) {
        var t = id ? getTraining(id) : null;
        openModal(
          "<h3>" + (t ? "Ubah Pelatihan" : "Tambah Pelatihan") + "</h3>" +
          '<p class="msub">' + (t ? "Perbarui data pelatihan “" + esc(t.nama) + "”." : "Isi data pelatihan baru untuk PT Maju Bersama.") + "</p>" +
          trainingFormHTML(t) +
          '<div class="mfoot"><button type="button" class="btn ghost" data-close>Batal</button>' +
          '<button type="button" class="btn" id="mSave">' + (t ? "Simpan Perubahan" : "Tambah Pelatihan") + "</button></div>"
        );
        document.getElementById("mSave").addEventListener("click", function () {
          var nama = document.getElementById("fNama").value.trim();
          var pelatih = document.getElementById("fPelatih").value.trim();
          if (!nama || !pelatih) { toast("Nama pelatihan dan pelatih wajib diisi."); return; }
          var data = {
            nama: nama,
            kategori: document.getElementById("fKategori").value,
            status: document.getElementById("fStatus").value,
            pelatih: pelatih,
            durasi: Math.max(1, parseInt(document.getElementById("fDurasi").value, 10) || 1),
            tanggal: document.getElementById("fTanggal").value || todayISO(),
            jam: document.getElementById("fJam").value.trim() || "08.00–16.00",
            tempat: document.getElementById("fTempat").value.trim() || "—"
          };
          if (t) { for (var k in data) t[k] = data[k]; toast("Pelatihan “" + nama + "” berhasil diubah."); }
          else { data.id = state.nextTid++; state.trainings.push(data); toast("Pelatihan “" + nama + "” berhasil ditambahkan."); }
          closeModal(); render();
        });
      }
      function openTrainingDetail(id) {
        var t = getTraining(id); if (!t) return;
        var ps = partsOf(id), ms = matsOf(id);
        var plist = ps.length ? '<ul class="mini-list">' + ps.map(function (p) {
          return "<li><span>" + esc(p.nama) + ' <span style="color:var(--muted)">· ' + esc(p.divisi) + "</span></span>" + statusBadge(p.status) + "</li>";
        }).join("") + "</ul>" : '<p style="color:var(--muted);font-size:.9rem;margin:6px 0 0">Belum ada peserta terdaftar.</p>';
        var mlist = ms.length ? '<ul class="mini-list">' + ms.map(function (m) {
          return "<li><span>" + esc(m.judul) + '</span><span class="badge outline">' + esc(m.jenis) + "</span></li>";
        }).join("") + "</ul>" : '<p style="color:var(--muted);font-size:.9rem;margin:6px 0 0">Belum ada materi untuk pelatihan ini.</p>';
        openModal(
          "<h3>" + esc(t.nama) + "</h3>" +
          '<p class="msub">' + esc(t.kategori) + " · " + statusBadge(t.status) + "</p>" +
          '<div class="detail-grid">' +
          "<div><span>Pelatih</span><b>" + esc(t.pelatih) + "</b></div>" +
          "<div><span>Durasi</span><b>" + t.durasi + " hari</b></div>" +
          "<div><span>Tanggal</span><b>" + dateRange(t) + "</b></div>" +
          "<div><span>Jam</span><b>" + esc(t.jam) + " WIB</b></div>" +
          "<div><span>Tempat</span><b>" + esc(t.tempat) + "</b></div>" +
          "<div><span>Jumlah Peserta</span><b>" + ps.length + " orang</b></div>" +
          "</div>" +
          "<h4>Peserta (" + ps.length + ")</h4>" + plist +
          "<h4>Materi (" + ms.length + ")</h4>" + mlist +
          '<div class="mfoot"><button type="button" class="btn danger" id="mDel">Hapus</button>' +
          '<button type="button" class="btn ghost" id="mEdit">Ubah</button>' +
          '<button type="button" class="btn" data-close>Tutup</button></div>',
          true
        );
        document.getElementById("mEdit").addEventListener("click", function () { openTrainingForm(id); });
        document.getElementById("mDel").addEventListener("click", function () { confirmDeleteTraining(id); });
      }
      function confirmDeleteTraining(id) {
        var t = getTraining(id); if (!t) return;
        openModal(
          "<h3>Hapus Pelatihan?</h3>" +
          '<p class="msub">Pelatihan “' + esc(t.nama) + "” beserta " + partsOf(id).length + " peserta dan " + matsOf(id).length + " materinya akan dihapus. Sertifikat yang sudah terbit tetap tersimpan. Tindakan ini tidak bisa dibatalkan.</p>" +
          '<div class="mfoot"><button type="button" class="btn ghost" data-close>Batal</button>' +
          '<button type="button" class="btn danger" id="mYes">Ya, Hapus</button></div>'
        );
        document.getElementById("mYes").addEventListener("click", function () {
          state.trainings = state.trainings.filter(function (x) { return x.id !== id; });
          state.participants = state.participants.filter(function (x) { return x.tid !== id; });
          state.materials = state.materials.filter(function (x) { return x.tid !== id; });
          if (state.pesertaTid === id) state.pesertaTid = state.trainings.length ? state.trainings[0].id : 0;
          closeModal(); render(); toast("Pelatihan “" + t.nama + "” telah dihapus.");

      /* ================= TAB 2: PESERTA ================= */
      function trainingOptions(selected) {
        return state.trainings.map(function (t) {
          return '<option value="' + t.id + '"' + (t.id === selected ? " selected" : "") + ">" + esc(t.nama) + "</option>";
        }).join("");
      }
      function pagePeserta() {
        if (!state.trainings.length) return '<div class="page-head"><h2>Peserta Pelatihan</h2></div><div class="empty">Belum ada pelatihan. Tambahkan pelatihan dulu di tab Pelatihan.</div>';
        if (!getTraining(state.pesertaTid)) state.pesertaTid = state.trainings[0].id;
        var t = getTraining(state.pesertaTid);
        var ps = partsOf(t.id);
        var rows = ps.map(function (p) {
          var stOpts = ["Terdaftar", "Hadir", "Lulus", "Tidak Lulus"].map(function (s) {
            return '<option value="' + s + '"' + (s === p.status ? " selected" : "") + ">" + s + "</option>";
          }).join("");

            ? '<input class="nilai-inp" type="number" min="0" max="100" value="' + (p.nilai == null ? "" : p.nilai) + '" data-nilai="' + p.id + '" aria-label="Nilai ' + esc(p.nama) + '" placeholder="Nilai">'
            : '<span style="color:var(--muted);font-size:.85rem">Nilai: —</span>';
          return '<div class="row"><div class="main"><div class="t">' + esc(p.nama) + '</div><div class="s">Divisi ' + esc(p.divisi) + " · " + esc(t.nama) + "</div></div>" +
            nilaiCell +
            '<select class="status-sel" data-status="' + p.id + '" aria-label="Status ' + esc(p.nama) + '">' + stOpts + "</select>" +
            '<button type="button" class="btn danger small" data-del-p="' + p.id + '">Hapus</button></div>';
        }).join("");
        return '<div class="page-head"><h2>Peserta Pelatihan</h2><p class="sub">Pilih pelatihan untuk melihat dan mengelola pesertanya. Ubah status dan nilai langsung pada daftar — perubahan otomatis terbaca di tab Laporan dan Sertifikat.</p></div>' +
          '<div class="toolbar"><label class="f"><span>Pelatihan</span><select id="selTraining">' + trainingOptions(t.id) + "</select></label>" +
          '<button type="button" class="btn" id="btnAddParticipant">' + IC.plus + "Tambah Peserta</button></div>" +
          '<p style="margin:0 0 12px;color:var(--muted);font-size:.9rem">' + ps.length + " peserta · " + esc(t.nama) + " · " + dateRange(t) + " · " + esc(t.tempat) + "</p>" +
          (ps.length ? '<div class="rowlist">' + rows + "</div>" : '<div class="empty">Belum ada peserta pada pelatihan ini. Klik “Tambah Peserta” untuk mendaftarkan karyawan.</div>');
      }
      function openParticipantForm(tid) {
        var t = getTraining(tid); if (!t) return;
        var divOpts = DIVISI.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + "</option>"; }).join("");
        var stOpts = ["Terdaftar", "Hadir", "Lulus", "Tidak Lulus"].map(function (s) { return '<option value="' + s + '">' + s + "</option>"; }).join("");
        openModal(
          "<h3>Tambah Peserta</h3>" +
          '<p class="msub">Daftarkan karyawan ke pelatihan “' + esc(t.nama) + '”.</p>' +
          '<label class="f"><span>Nama Karyawan</span><input id="pNama" type="text" placeholder="cth. Sari Wulandari" required></label>' +
          '<div class="form-grid"><label class="f"><span>Divisi</span><select id="pDivisi">' + divOpts + "</select></label>" +
          '<label class="f"><span>Status</span><select id="pStatus">' + stOpts + "</select></label></div>" +
          '<label class="f"><span>Nilai (0–100, isi bila status Lulus / Tidak Lulus)</span><input id="pNilai" type="number" min="0" max="100" placeholder="cth. 85"></label>' +
          '<div class="mfoot"><button type="button" class="btn ghost" data-close>Batal</button>' +
          '<button type="button" class="btn" id="mSaveP">Tambah Peserta</button></div>'
        );
        document.getElementById("mSaveP").addEventListener("click", function () {
          var nama = document.getElementById("pNama").value.trim();
          if (!nama) { toast("Nama karyawan wajib diisi."); return; }
          var status = document.getElementById("pStatus").value;
          var nilaiRaw = document.getElementById("pNilai").value;
          var nilai = (status === "Lulus" || status === "Tidak Lulus") && nilaiRaw !== "" ? Math.max(0, Math.min(100, parseInt(nilaiRaw, 10) || 0)) : null;

      /* ================= TAB 3: JADWAL ================= */
      function pageJadwal() {
        var today = todayISO();

          var e = endDate(t);
          var when, badgeCls;
          if (e < today) { when = "Sudah Lewat"; badgeCls = "gray"; }
          else if (t.tanggal <= today && today <= e) { when = t.tanggal === e ? "Hari Ini" : "Sedang Berlangsung"; badgeCls = "green"; }
          else { when = "Akan Datang"; badgeCls = "outline"; }
          var d = parseISO(t.tanggal);
          return '<div class="row' + (e < today ? " past" : "") + '">' +
            '<div class="sched-date"><div class="d">' + d.getDate() + '</div><div class="m">' + BULAN_S[d.getMonth()] + " " + d.getFullYear() + "</div></div>" +

          '<tr><td data-l="Pelatihan">Total</td><td data-l="Peserta" class="num">' + totPeserta + '</td><td data-l="Hadir" class="num">' + totHadir + '</td><td data-l="Lulus" class="num">' + lulus + "</td></tr>" +
          "</tbody></table>" +
          '<p style="margin:12px 0 0;color:var(--muted);font-size:.85rem">Tingkat kelulusan dihitung dari peserta yang sudah dinilai: ' + lulus + " lulus dari " + dinilai + " peserta (Lulus + Tidak Lulus).</p></div>";
      }
      function downloadCSV() {
        var rows = reportRows();
        var lulus = state.participants.filter(function (p) { return p.status === "Lulus"; }).length;
        var tdk = state.participants.filter(function (p) { return p.status === "Tidak Lulus"; }).length;
        var dinilai = lulus + tdk;
        var rate = dinilai ? Math.round((lulus / dinilai) * 1000) / 10 : 0;
        function q(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
        var lines = [
          "Laporan Pelatihan Karyawan — PT Maju Bersama",
          "Tanggal unduh;" + fmtDate(todayISO()),
          "",
          "Ringkasan",
          "Total Pelatihan;" + state.trainings.length,
          "Total Peserta;" + state.participants.length,
          "Tingkat Kelulusan (%);" + String(rate).replace(".", ","),
          "Sertifikat Diterbitkan;" + state.certificates.length,
          "",
          "Pelatihan;Status;Peserta;Hadir;Lulus"
        ];
        rows.forEach(function (r) { lines.push([q(r.nama), r.status, r.peserta, r.hadir, r.lulus].join(";")); });
        var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "laporan-pelatihan-pt-maju-bersama.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 800);
        toast("Laporan berhasil diunduh sebagai berkas CSV.");
      }

      /* ================= MODAL ================= */
      var overlay = document.getElementById("overlay");
      var modalBox = document.getElementById("modalBox");
      function openModal(html, wide) {
        modalBox.className = "modal" + (wide ? " wide" : "");
        modalBox.innerHTML = html;
        overlay.classList.add("open");
        var closers = modalBox.querySelectorAll("[data-close]");
        for (var i = 0; i < closers.length; i++) closers[i].addEventListener("click", closeModal);
        var first = modalBox.querySelector("input, select");
        if (first) setTimeout(function () { first.focus(); }, 60);
      }
      function closeModal() { overlay.classList.remove("open"); modalBox.innerHTML = ""; }
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

      /* ================= IKAT EVENT PER HALAMAN ================= */
      function on(sel, ev, fn) { var el = document.querySelector(sel); if (el) el.addEventListener(ev, fn); }
      function onAll(attr, fn) {
        var els = document.querySelectorAll("[" + attr + "]");
        for (var i = 0; i < els.length; i++) (function (el) { el.addEventListener("click", function (e) { e.stopPropagation(); fn(el.getAttribute(attr)); }); })(els[i]);
      }
      function bindPage() {
        on("#btnAddTraining", "click", function () { openTrainingForm(null); });
        on("#btnAddParticipant", "click", function () { openParticipantForm(state.pesertaTid); });
        on("#btnAddMaterial", "click", openMaterialForm);
        on("#btnIssue", "click", issueCertificate);
        on("#btnCsv", "click", downloadCSV);
        on("#selTraining", "change", function () { state.pesertaTid = parseInt(this.value, 10); render(); });

        onAll("data-edit-t", function (id) { openTrainingForm(parseInt(id, 10)); });
        onAll("data-del-t", function (id) { confirmDeleteTraining(parseInt(id, 10)); });
        onAll("data-del-p", function (id) {
          var pid = parseInt(id, 10), p = null;
          for (var i = 0; i < state.participants.length; i++) if (state.participants[i].id === pid) p = state.participants[i];
          state.participants = state.participants.filter(function (x) { return x.id !== pid; });
          render(); if (p) toast("Peserta " + p.nama + " telah dihapus.");
        });
        onAll("data-del-m", function (id) {
          var mid = parseInt(id, 10);
          state.materials = state.materials.filter(function (x) { return x.id !== mid; });
          render(); toast("Materi telah dihapus.");
        });
        onAll("data-del-c", function (id) {
          var cid = parseInt(id, 10);
          state.certificates = state.certificates.filter(function (x) { return x.id !== cid; });
          render(); toast("Sertifikat telah dihapus.");
        });
        var files = document.querySelectorAll("[data-file]");
        for (var f = 0; f < files.length; f++) (function (el) {
          el.addEventListener("click", function (e) { e.preventDefault(); toast("“" + el.getAttribute("data-file") + "” adalah berkas contoh pada versi demo."); });
        })(files[f]);

        var cards = document.querySelectorAll("[data-detail]");
        for (var c = 0; c < cards.length; c++) (function (el) {
          el.addEventListener("click", function () { openTrainingDetail(parseInt(el.getAttribute("data-detail"), 10)); });
          el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTrainingDetail(parseInt(el.getAttribute("data-detail"), 10)); } });
        })(cards[c]);

        var sels = document.querySelectorAll("[data-status]");
        for (var s = 0; s < sels.length; s++) (function (el) {
          el.addEventListener("change", function () {
            var pid = parseInt(el.getAttribute("data-status"), 10);
            for (var i = 0; i < state.participants.length; i++) {
              if (state.participants[i].id === pid) {

<!-- KIKI-PENGATURAN v1 (panel Pengaturan: nama, warna, logo, pengguna) -->
<script>
/* ============================================================
   KIKI-PENGATURAN v1 — Panel Pengaturan (nama, warna, logo,
   pengguna). Cuplikan mandiri, tanpa dependensi eksternal.
   Disimpan per aplikasi di localStorage. Mode: app
   (app = aplikasi bisnis, game = game, web = website demo)
   ============================================================ */
(function () {
  if (window.__kikiSet) return;
  window.__kikiSet = true;
  var KIKI_MODE = 'app'; /* app | game | web */

  var slug = (location.pathname.replace(/\/index\.html?$/i, '').split('/').filter(Boolean).pop() || 'beranda');
  var KEY = 'kikiSet:' + slug;
  var DEF = { nama: '', warna: '', logo: '', users: [], aktif: '' };
  var S = load();
  var defaultName = detectDefaultName();
  var nameTarget = findNameTarget();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') return merge(DEF, o); }
    } catch (e) {}
    return merge(DEF, {});
  }
  function merge(d, o) {
    var r = {};
    for (var k in d) r[k] = (o[k] !== undefined && o[k] !== null) ? o[k] : d[k];
    if (!Array.isArray(r.users)) r.users = [];
    return r;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- deteksi nama & target ---------- */
  function detectDefaultName() {
    var cn = document.getElementById('companyName');
    if (cn) return cn.textContent.trim();
    var h1 = document.querySelector('.hero h1') || document.querySelector('h1');
    if (h1) {
      var t = h1.textContent.trim();
      var m = t.split(/\s+[—–-]\s+/);
      if (m.length > 1) return m[m.length - 1].trim();
    }
    return '';
  }
  function findNameTarget() {
    var cn = document.getElementById('companyName');
    if (cn) return cn;
    var h1 = document.querySelector('.hero h1') || document.querySelector('h1');
    if (h1 && KIKI_MODE !== 'game') return h1;
    if (KIKI_MODE === 'web') {
      var b = document.querySelector('header .brand, header .logo-text, header .logo, header a');
      if (b && b.textContent.trim().length < 40) return b;
    }
    return null;
  }
  function effName() { return (S.nama || '').trim() || defaultName; }

  /* ---------- warna ---------- */
  function shade(hex, pct) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return '#14263d';
    var n = parseInt(h, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255, f = 1 + pct / 100;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function applyColor() {
    var root = document.documentElement;
    var st = document.getElementById('kiki-theme');
    if (!S.warna) {
      ['--kiki-accent', '--kiki-accent-dark', '--navy', '--blue'].forEach(function (v) { root.style.removeProperty(v); });
      if (st) st.remove();
      return;
    }
    var dark = shade(S.warna, -35);
    root.style.setProperty('--kiki-accent', S.warna);
    root.style.setProperty('--kiki-accent-dark', dark);
    root.style.setProperty('--navy', dark);
    root.style.setProperty('--blue', S.warna);
    if (KIKI_MODE === 'app') {
      if (!st) {
        st = document.createElement('style');
        st.id = 'kiki-theme';
        document.head.appendChild(st);
      }
      st.textContent =
        '.hero{background:linear-gradient(135deg,var(--kiki-accent-dark),var(--kiki-accent))!important}' +
        '.tab-btn.active{background:var(--kiki-accent)!important;border-color:var(--kiki-accent)!important}' +
        '.btn:not(.secondary):not(.btn-ghost):not(.ghost):not(.danger){background:var(--kiki-accent)!important;border-color:var(--kiki-accent)!important}';
    } else if (st) { st.remove(); }
  }

  /* ---------- nama ---------- */
  function applyName() {
    var name = effName();
    if (!nameTarget || KIKI_MODE === 'game') { updateBtnTitle(); return; }
    if (nameTarget.id === 'companyName') { nameTarget.textContent = name; updateBtnTitle(); return; }
    if (nameTarget.tagName === 'H1') {
      if (!nameTarget.dataset.kikiOrig) nameTarget.dataset.kikiOrig = nameTarget.textContent.trim();
      var orig = nameTarget.dataset.kikiOrig;
      var parts = orig.split(/\s+[—–-]\s+/);
      if (parts.length > 1) {
        nameTarget.textContent = parts.slice(0, -1).join(' — ') + ' — ' + name;
      } else if (S.nama.trim()) {
        nameTarget.textContent = orig + ' — ' + S.nama.trim();
      } else {
        nameTarget.textContent = orig;
      }
    } else {
      if (S.nama.trim()) nameTarget.textContent = S.nama.trim();
    }
    updateBtnTitle();
  }

  /* ---------- logo ---------- */
  function applyLogo() {
    var old = document.querySelector('.kiki-logo');
    if (old) old.remove();
    var fav = document.querySelector('link[rel="icon"], link[rel="shortcut icon"]');
    if (S.logo) {
      if (nameTarget && KIKI_MODE !== 'game') {
        var img = document.createElement('img');
        img.className = 'kiki-logo';
        img.src = S.logo;
        img.alt = 'Logo';
        img.style.cssText = 'height:42px;width:42px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:10px;background:#fff';
        nameTarget.parentNode.insertBefore(img, nameTarget);
      }
      if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
      fav.href = S.logo;
    }
  }
  function applyAll() { applyName(); applyColor(); applyLogo(); }

  /* ---------- CSS panel ---------- */
  var css = document.createElement('style');
  css.textContent = [
    '.kiki-fab{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;align-items:center;gap:8px;background:#14263d;color:#fff;border:0;border-radius:999px;padding:12px 18px;font:700 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 8px 24px rgba(20,38,61,.35);cursor:pointer}',
    '.kiki-fab:hover{background:#2f639e}',
    '@media (max-width:600px){.kiki-fab span{display:none}.kiki-fab{padding:12px 14px}}',
    '.kiki-overlay{position:fixed;inset:0;z-index:10000;background:rgba(20,38,61,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}',
    '.kiki-overlay[hidden]{display:none}',
    '.kiki-card{box-sizing:border-box;width:100%;max-width:520px;background:#fff;color:#14263d;border-radius:16px;box-shadow:0 16px 48px rgba(20,38,61,.3);padding:22px;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}',
    '.kiki-card *{box-sizing:border-box}',
    '.kiki-card h2{margin:0 0 4px;font-size:20px}',
    '.kiki-card .kiki-sub{color:#5b6b80;font-size:13.5px;margin:0 0 16px}',
    '.kiki-sec{border-top:1px solid #dbe4ef;padding:14px 0}',
    '.kiki-sec[hidden]{display:none}',
    '.kiki-sec h3{margin:0 0 8px;font-size:15px}',
    '.kiki-sec p{margin:0 0 8px;color:#5b6b80;font-size:13.5px}',
    '.kiki-card label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}',
    '.kiki-card input[type=text],.kiki-card input[type=color],.kiki-card select{width:100%;padding:10px 12px;border:1.5px solid #dbe4ef;border-radius:10px;background:#f7f9fc;color:#14263d;font:inherit}',
    '.kiki-card input[type=color]{height:44px;padding:4px}',
    '.kiki-swatches{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}',
    '.kiki-sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #dbe4ef;cursor:pointer;padding:0}',
    '.kiki-sw.on{box-shadow:0 0 0 2.5px #14263d}',
    '.kiki-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}',
    '.kiki-btn{background:#14263d;color:#fff;border:0;border-radius:10px;padding:9px 15px;font:700 13.5px system-ui,sans-serif;cursor:pointer}',
    '.kiki-btn.sec{background:#eef3f9;color:#14263d;border:1px solid #dbe4ef}',
    '.kiki-btn.danger{background:#f9e6e3;color:#b3372f}',
    '.kiki-user{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid #dbe4ef;border-radius:10px;padding:8px 12px;margin-bottom:8px}',
    '.kiki-user b{font-size:14px}',
    '.kiki-user .tag{font-size:12px;color:#5b6b80}',
    '.kiki-close{float:right;background:#eef3f9;border:0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#14263d}',
    '.kiki-logo-preview{max-height:64px;max-width:200px;border-radius:10px;border:1px solid #dbe4ef;display:block;margin:8px 0}',
    '.kiki-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:10001;background:#14263d;color:#fff;border-radius:999px;padding:10px 18px;font:700 13.5px system-ui,sans-serif;box-shadow:0 8px 24px rgba(20,38,61,.35);opacity:0;pointer-events:none;transition:opacity .2s}',
    '.kiki-toast.show{opacity:1}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---------- tombol & panel ---------- */
  var fab = document.createElement('button');
  fab.type = 'button';
  fab.className = 'kiki-fab';
  fab.innerHTML = '&#9881; <span>Pengaturan</span>';
  fab.title = 'Pengaturan';
  document.body.appendChild(fab);

  var overlay = document.createElement('div');
  overlay.className = 'kiki-overlay';
  overlay.hidden = true;
  overlay.innerHTML =
    '<div class="kiki-card" role="dialog" aria-label="Pengaturan">' +
    '<button class="kiki-close" type="button" data-kiki-close title="Tutup">&times;</button>' +
    '<h2>Pengaturan</h2><p class="kiki-sub">Tersimpan di perangkat ini saja (localStorage). Berlaku untuk aplikasi ini.</p>' +
    '<div class="kiki-sec"><h3>Nama Usaha / Toko</h3>' +
    '<label for="kiki-nama">Nama yang tampil di aplikasi</label>' +
    '<input type="text" id="kiki-nama" autocomplete="off" placeholder="cth: Toko Sari Jaya">' +
    '<p>Nama ini tampil di judul aplikasi. Kosongkan untuk kembali ke nama awal.</p></div>' +
    '<div class="kiki-sec"><h3>Warna Tema</h3>' +
    '<div class="kiki-swatches" id="kiki-swatches"></div>' +
    '<label for="kiki-warna">Warna utama (pilih sendiri)</label>' +
    '<input type="color" id="kiki-warna" value="#14263d">' +
    '<div class="kiki-row" style="margin-top:10px"><button class="kiki-btn sec" type="button" id="kiki-reset-warna">Kembalikan warna awal</button></div></div>' +
    '<div class="kiki-sec"><h3>Logo</h3>' +
    '<img class="kiki-logo-preview" id="kiki-logo-preview" hidden alt="Logo">' +
    '<label for="kiki-logo">Unggah logo (gambar, maks 1,5 MB)</label>' +
    '<input type="file" id="kiki-logo" accept="image/*">' +
    '<div class="kiki-row" style="margin-top:10px"><button class="kiki-btn sec" type="button" id="kiki-hapus-logo">Hapus logo</button></div></div>' +
    '<div class="kiki-sec" id="kiki-sec-user"><h3>Pengguna</h3><div id="kiki-user-body"></div></div>' +
    '<div class="kiki-sec"><div class="kiki-row"><button class="kiki-btn" type="button" data-kiki-close>Tutup</button>' +
    '<button class="kiki-btn sec" type="button" id="kiki-reset-semua">Reset semua pengaturan</button></div></div>' +
    '</div>';
  document.body.appendChild(overlay);

  var toastEl = document.createElement('div');
  toastEl.className = 'kiki-toast';
  document.body.appendChild(toastEl);
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------- pengguna ---------- */
  function hasLoginSystem() {
    if (document.getElementById('userChip')) return 'chip';
    if (document.querySelector('.login-overlay, #loginOverlay, [id*=login i]')) return 'login';
    return null;
  }
  function renderUsers() {
    var body = document.getElementById('kiki-user-body');
    var sec = document.getElementById('kiki-sec-user');
    if (KIKI_MODE === 'web') { sec.hidden = true; sec.style.display = 'none'; return; }
    sec.hidden = false; sec.style.display = '';
    var sys = hasLoginSystem();
    if (sys === 'chip') {
      var chip = document.getElementById('userChip');
      var cur = chip ? chip.textContent.trim() : '—';
      var tabBtn = document.querySelector('[data-tab="pengguna"]');
      var tabHidden = tabBtn && getComputedStyle(tabBtn).display === 'none';
      body.innerHTML = '<p>Pengguna aktif: <b>' + esc(cur) + '</b></p>' +
        (tabHidden
          ? '<p>Aplikasi ini punya kelola pengguna sendiri — masuk sebagai Admin untuk menambah pengguna.</p>'
          : '<p>Aplikasi ini punya kelola pengguna sendiri (nama, peran, kata sandi).</p>' +
            '<button class="kiki-btn" type="button" id="kiki-buka-user">Buka Kelola Pengguna</button>');
      var b = document.getElementById('kiki-buka-user');
      if (b) b.addEventListener('click', function () {
        closePanel();
        if (tabBtn) tabBtn.click();
      });
      return;
    }
    if (sys === 'login') {
      body.innerHTML = '<p>Aplikasi ini punya layar login sendiri — pengguna dikelola lewat login aplikasi.</p>';
      return;
    }
    var label = KIKI_MODE === 'game' ? 'Profil pemain — pilih siapa yang sedang bermain.' : 'Daftar pengguna aplikasi ini. Pengguna aktif tampil di tombol Pengaturan.';
    var html = '<p>' + label + '</p>';
    if (!S.users.length) html += '<p>Belum ada pengguna — tambahkan di bawah.</p>';
    S.users.forEach(function (u, i) {
      html += '<div class="kiki-user"><span><b>' + esc(u) + '</b>' +
        (S.aktif === u ? ' <span class="tag">• aktif</span>' : '') + '</span><span class="kiki-row">' +
        (S.aktif !== u ? '<button class="kiki-btn sec" type="button" data-kiki-aktif="' + i + '">Pilih</button>' : '') +
        '<button class="kiki-btn danger" type="button" data-kiki-hapus-user="' + i + '">Hapus</button></span></div>';
    });
    html += '<label for="kiki-user-baru">Tambah pengguna</label>' +
      '<div class="kiki-row"><input type="text" id="kiki-user-baru" autocomplete="off" placeholder="Nama pengguna" style="flex:1;min-width:140px">' +
      '<button class="kiki-btn" type="button" id="kiki-tambah-user">Tambah</button></div>';
    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll('[data-kiki-aktif]'), function (btn) {
      btn.addEventListener('click', function () {
        S.aktif = S.users[+btn.getAttribute('data-kiki-aktif')] || '';
        save(); renderUsers(); updateBtnTitle(); toast('Pengguna aktif: ' + S.aktif);
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-kiki-hapus-user]'), function (btn) {
      btn.addEventListener('click', function () {
        var i = +btn.getAttribute('data-kiki-hapus-user');
        if (S.aktif === S.users[i]) S.aktif = '';
        S.users.splice(i, 1);
        save(); renderUsers(); updateBtnTitle(); toast('Pengguna dihapus');
      });
    });
    document.getElementById('kiki-tambah-user').addEventListener('click', function () {
      var inp = document.getElementById('kiki-user-baru');
      var v = inp.value.trim();
      if (!v) { toast('Isi nama pengguna dulu'); return; }
      if (S.users.indexOf(v) < 0) S.users.push(v);
      S.aktif = v;
      save(); renderUsers(); updateBtnTitle(); toast('Pengguna ditambahkan: ' + v);
    });
  }

  function updateBtnTitle() {
    var t = 'Pengaturan';
    if (effName()) t += ' — ' + effName();
    if (S.aktif) t += ' (pengguna: ' + S.aktif + ')';
    fab.title = t;
  }

  /* ---------- isi panel ---------- */
  var PRESETS = ['#14263d', '#2f639e', '#2e7d4f', '#0f766e', '#5b4a8a', '#8c2f2f', '#96690f', '#9d2c5a'];
  var swWrap = document.getElementById('kiki-swatches');
  PRESETS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'kiki-sw' + (S.warna === c ? ' on' : '');
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', function () {
      S.warna = c;
      save(); applyColor(); syncSwatches();
      document.getElementById('kiki-warna').value = c;
      toast('Warna tema diubah');
    });
    swWrap.appendChild(b);
  });
  function syncSwatches() {
    Array.prototype.forEach.call(swWrap.children, function (b, i) {
      b.classList.toggle('on', PRESETS[i] === S.warna);
    });
  }

  var namaInput = document.getElementById('kiki-nama');
  var warnaInput = document.getElementById('kiki-warna');
  var logoInput = document.getElementById('kiki-logo');
  var logoPrev = document.getElementById('kiki-logo-preview');

  function syncPanel() {
    namaInput.value = S.nama || '';
    warnaInput.value = S.warna || '#14263d';
    syncSwatches();
    if (S.logo) { logoPrev.src = S.logo; logoPrev.hidden = false; }
    else { logoPrev.removeAttribute('src'); logoPrev.hidden = true; }
    renderUsers();
  }

  namaInput.addEventListener('input', function () {
    S.nama = namaInput.value;
    save(); applyName();
  });
  warnaInput.addEventListener('input', function () {
    S.warna = warnaInput.value;
    save(); applyColor(); syncSwatches();
  });
  document.getElementById('kiki-reset-warna').addEventListener('click', function () {
    S.warna = '';
    save(); applyColor(); syncPanel(); toast('Warna kembali ke awal');
  });
  logoInput.addEventListener('change', function () {
    var f = logoInput.files && logoInput.files[0];
    if (!f) return;
    if (f.size > 1500000) { toast('Logo terlalu besar (maks 1,5 MB)'); logoInput.value = ''; return; }
    var r = new FileReader();
    r.onload = function () {
      S.logo = r.result;
      save(); applyLogo(); syncPanel(); toast('Logo dipasang');
    };
    r.onerror = function () { toast('Gagal membaca file logo'); };
    r.readAsDataURL(f);
  });
  document.getElementById('kiki-hapus-logo').addEventListener('click', function () {
    S.logo = '';
    save(); applyLogo(); syncPanel(); logoInput.value = ''; toast('Logo dihapus');
  });
  document.getElementById('kiki-reset-semua').addEventListener('click', function () {
    if (!window.confirm('Hapus semua pengaturan aplikasi ini dan kembali ke awal?')) return;
    S = merge(DEF, {});
    save(); applyAll(); syncPanel(); toast('Pengaturan direset');
  });

  /* ---------- buka/tutup ---------- */
  function openPanel() { syncPanel(); overlay.hidden = false; }
  function closePanel() { overlay.hidden = true; }
  fab.addEventListener('click', openPanel);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closePanel();
    var c = e.target.closest ? e.target.closest('[data-kiki-close]') : null;
    if (c) closePanel();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });

  applyAll();
  updateBtnTitle();
})();

</script>
